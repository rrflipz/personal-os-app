<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Personal OS</title>
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#4B5C3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9E4D8; --surface: #FFFFFF;
    --ink: #23291F; --ink-soft: #5B6155;
    --moss: #4B5C3E; --moss-dim: #7C8A6C; --brass: #A67C3D;
    --line: #D3CBBA;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex; justify-content:center; align-items:stretch; min-height:100vh;
  }
  .hidden{ display:none !important; }
  .wrap{ width:100%; max-width:420px; margin:auto; padding:40px 24px; }
  .wordmark{ font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0 0 6px; }
  .wordmark em{ font-style:italic; color:var(--moss); }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin:0 0 28px; line-height:1.5; }
  .form{ display:flex; flex-direction:column; gap:12px; }
  .form input{
    padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; font-family:'IBM Plex Sans', sans-serif; background:var(--surface);
  }
  .form input:focus{ outline:none; border-color:var(--moss-dim); }
  .form button{
    background:var(--moss); color:#fff; border:none; border-radius:10px;
    padding:12px 20px; font-size:14.5px; font-weight:500; cursor:pointer; margin-top:4px;
  }
  .form button:hover{ background:#3d4b32; }
  .form button:disabled{ background:var(--line); color:var(--ink-soft); cursor:not-allowed; }
  .msg{ font-size:13.5px; min-height:18px; margin:0 0 6px; line-height:1.5; }
  .msg.error{ color:#a14a3a; }
  .msg.success{ color:var(--moss); }
  .back-link{ margin-top:18px; font-size:13.5px; text-align:center; }
  .back-link a{ color:var(--moss); text-decoration:underline; }
</style>
</head>
<body>

<div class="wrap">
  <h1 class="wordmark">Your <em>Personal OS</em></h1>

  <div id="formState">
    <p class="sub" id="subText">Enter a new password for your account.</p>
    <p class="msg" id="msg"></p>
    <form class="form" id="resetForm">
      <input type="password" id="newPassword" placeholder="New password (8+ characters)" required autocomplete="new-password">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
      <button type="submit" id="submitBtn">Set new password</button>
    </form>
  </div>

  <div class="hidden" id="successState">
    <p class="msg success">Your password has been reset. You can log in with it now.</p>
  </div>

  <p class="back-link"><a href="/">Back to Personal OS</a></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const formState = document.getElementById('formState');
const successState = document.getElementById('successState');
const subText = document.getElementById('subText');
const msg = document.getElementById('msg');
const resetForm = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

if (!token) {
  subText.textContent = 'This link is missing its reset token.';
  msg.className = 'msg error';
  msg.textContent = 'Request a new reset link from the login screen.';
  resetForm.classList.add('hidden');
}

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg error';
  msg.textContent = '';

  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword.length < 8) {
    msg.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if (newPassword !== confirmPassword) {
    msg.textContent = "Passwords don't match.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Setting password...';

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Something went wrong.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set new password';
      return;
    }
    formState.classList.add('hidden');
    successState.classList.remove('hidden');
  } catch (err) {
    msg.textContent = 'Could not reach the server. Try again.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Set new password';
  }
});
</script>

</body>
</html>
